# Whole app: Postgres + API + web.  Run:  docker compose up --build
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ats
      POSTGRES_PASSWORD: ats
      POSTGRES_DB: ats
    ports:
      # 5433 on the host so it doesn't clash with a locally installed Postgres.
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ats -d ats"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ats:ats@db:5432/ats?schema=public
      PORT: 4000
      CORS_ORIGIN: http://localhost:${WEB_PORT:-3000}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
      # Sign-in: JWT signing secret and the account created on first start.
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string-0123456789}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-recruiter@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-password123}
      ADMIN_NAME: ${ADMIN_NAME:-Demo Recruiter}
      # Cookies over http on localhost; set to true behind HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
    ports:
      - "4000:4000"

  web:
    build:
      context: ./web
      args:
        # The browser calls the API directly, so this is the host-side URL.
        NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  db-data:
